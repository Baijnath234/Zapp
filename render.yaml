services:
  - type: web
    name: zapp-backend
    runtime: node
    plan: starter
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: zapp-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: zapp-postgres
    plan: starter
    databaseName: zapp_db
    user: zapp_user


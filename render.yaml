services:
  - type: web
    name: zapp-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: zapp-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: zapp-postgres
    plan: free
    databaseName: zapp_db
    user: zapp_user
